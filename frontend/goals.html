<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goals - AI Finance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>
    <div id="loading-overlay" style="display: none;">
        <div class="spinner"></div>
    </div>

    <!-- Sidebar -->
    <nav id="sidebar" class="sidebar">
        <!-- Sidebar content same as dashboard -->
        <div class="sidebar-header">
            <i class="bi bi-robot"></i>
            <h4>AI Finance</h4>
        </div>
        <div class="sidebar-nav">
            <a href="dashboard.html" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="transactions.html" class="nav-link"><i class="bi bi-receipt"></i> Transactions</a>
            <a href="budget.html" class="nav-link"><i class="bi bi-wallet2"></i> Budget</a>
            <a href="analytics.html" class="nav-link"><i class="bi bi-graph-up"></i> Analytics</a>
            <a href="goals.html" class="nav-link active"><i class="bi bi-trophy"></i> Goals</a>
            <a href="assistant.html" class="nav-link"><i class="bi bi-robot"></i> AI Assistant</a>
        </div>
        <div class="sidebar-footer">
            <a href="#" class="nav-link" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
        </div>
    </nav>

    <main class="main-content">
        <header class="top-bar">
            <div class="d-flex align-items-center gap-3">
                <button id="mobileToggle" class="mobile-toggle"><i class="bi bi-list"></i></button>
                <h4 class="mb-0">Financial Goals</h4>
            </div>
            <button class="btn btn-primary" onclick="openGoalModal()">
                <i class="bi bi-plus-lg me-1"></i> Add Goal
            </button>
        </header>

        <div id="goalsContainer" class="row g-4">
            <!-- Dynamic Content -->
        </div>

    </main>

    <!-- Goal Modal -->
    <div class="modal fade" id="goalModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add Goal</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="goalForm">
                        <input type="hidden" id="goalId">
                        
                        <div class="mb-3">
                            <label class="form-label">Goal Name</label>
                            <input type="text" class="form-control" id="goalName" required placeholder="e.g., Emergency Fund, New Car">
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Target Amount</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" id="targetAmount" required step="1" min="1">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Current Amount</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" id="currentAmount" required step="1" min="0" value="0">
                                </div>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Target Date</label>
                                <input type="date" class="form-control" id="targetDate" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Status</label>
                                <select class="form-select" id="goalStatus">
                                    <option value="Active">Active</option>
                                    <option value="Completed">Completed</option>
                                    <option value="Cancelled">Cancelled</option>
                                </select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" form="goalForm" class="btn btn-primary">Save Goal</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Update Progress Modal -->
    <div class="modal fade" id="progressModal" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Update Progress</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="progressForm">
                        <input type="hidden" id="progGoalId">
                        <div class="mb-3">
                            <label class="form-label">New Current Amount</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" id="progCurrentAmount" required step="1" min="0">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" form="progressForm" class="btn btn-primary">Update</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/goals.js"></script>
</body>
</html>

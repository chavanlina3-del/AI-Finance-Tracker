```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AI Finance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

    <div id="loading-overlay" style="display: none;">
        <div class="spinner"></div>
        <p class="mt-3">Creating account...</p>
    </div>

    <div class="auth-card text-center">
        <div class="mb-4">
            <i class="bi bi-robot text-primary" style="font-size: 3rem;"></i>
            <h3 class="mt-2">Create Account</h3>
            <p class="text-muted">Start tracking your finances with AI.</p>
        </div>

        <form id="registerForm" class="text-start">
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name"
                       required autocomplete="name" placeholder="Enter your full name">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email"
                       required autocomplete="email" placeholder="Enter your email">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password"
                       required minlength="6" autocomplete="new-password"
                       placeholder="Create a password">
            </div>

            <div class="mb-4">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword"
                       required minlength="6" autocomplete="new-password"
                       placeholder="Confirm your password">
            </div>

            <button id="registerButton" type="submit" class="btn btn-primary w-100 mb-3">
                Sign Up
            </button>

            <p class="text-center text-muted">
                Already have an account?
                <a href="login.html" class="text-primary text-decoration-none">Log in</a>
            </p>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            redirectIfAuth();

            const form = document.getElementById('registerForm');
            const button = document.getElementById('registerButton');

            form.addEventListener('submit', async (event) => {
                event.preventDefault();

                const name = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (password !== confirmPassword) {
                    showToast('Passwords do not match.', 'warning');
                    return;
                }

                showLoading();
                button.disabled = true;

                try {
                    const data = await apiRequest('/register', {
                        method: 'POST',
                        body: JSON.stringify({ name, email, password })
                    });

                    if (!data.success) {
                        throw new Error(data.error || 'Registration failed.');
                    }

                    showToast('Registration successful! Please log in.', 'success');

                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1000);

                } catch (error) {
                    console.error('Registration error:', error);
                    showToast(error.message || 'Could not register. Please try again.', 'danger');
                } finally {
                    hideLoading();
                    button.disabled = false;
                }
            });
        });
    </script>
</body>
</html>

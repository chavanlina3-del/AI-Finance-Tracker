```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - AI Finance Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* Stable chart containers prevent repeated canvas resizing. */
        .analytics-chart-container {
            position: relative;
            width: 100%;
            height: 320px;
            min-height: 320px;
        }

        .analytics-chart-container canvas {
            display: block;
            max-width: 100%;
        }

        .analytics-pie-container {
            position: relative;
            width: 100%;
            height: 320px;
            min-height: 320px;
        }

        @media (max-width: 767px) {
            .analytics-chart-container,
            .analytics-pie-container {
                height: 280px;
                min-height: 280px;
            }
        }

        @media print {
            #sidebar,
            .top-bar button,
            #loading-overlay {
                display: none !important;
            }

            .main-content {
                margin: 0 !important;
                width: 100% !important;
            }
        }
    </style>
</head>

<body>
    <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

    <div id="loading-overlay" style="display: none;">
        <div class="spinner"></div>
    </div>

    <nav id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <i class="bi bi-robot"></i>
            <h4>AI Finance</h4>
        </div>

        <div class="sidebar-nav">
            <a href="dashboard.html" class="nav-link">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
            <a href="transactions.html" class="nav-link">
                <i class="bi bi-receipt"></i> Transactions
            </a>
            <a href="budget.html" class="nav-link">
                <i class="bi bi-wallet2"></i> Budget
            </a>
            <a href="analytics.html" class="nav-link active">
                <i class="bi bi-graph-up"></i> Analytics
            </a>
            <a href="goals.html" class="nav-link">
                <i class="bi bi-trophy"></i> Goals
            </a>
            <a href="assistant.html" class="nav-link">
                <i class="bi bi-robot"></i> AI Assistant
            </a>
        </div>

        <div class="sidebar-footer">
            <a href="#" class="nav-link" onclick="logout(); return false;">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </div>
    </nav>

    <main class="main-content">
        <header class="top-bar">
            <div class="d-flex align-items-center gap-3">
                <button id="mobileToggle" class="mobile-toggle" type="button">
                    <i class="bi bi-list"></i>
                </button>
                <h4 class="mb-0">Analytics &amp; Reports</h4>
            </div>

            <div>
                <button class="btn btn-outline-primary btn-sm" onclick="window.print()">
                    <i class="bi bi-printer"></i> Export
                </button>
            </div>
        </header>

        <!-- Summary cards -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card bg-primary text-white mb-3 mb-md-0">
                    <div class="card-body">
                        <h6 class="text-white-50">Avg Monthly Income</h6>
                        <h3 id="avgIncome" class="mb-0">?0.00</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card bg-danger text-white mb-3 mb-md-0">
                    <div class="card-body">
                        <h6 class="text-white-50">Avg Monthly Expense</h6>
                        <h3 id="avgExpense" class="mb-0">?0.00</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card bg-success text-white mb-3 mb-md-0">
                    <div class="card-body">
                        <h6 class="text-white-50">Total Savings (YTD)</h6>
                        <h3 id="totalSavings" class="mb-0">?0.00</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card bg-info text-white">
                    <div class="card-body">
                        <h6 class="text-white-50">Top Category</h6>
                        <h3 id="topCategory" class="mb-0">-</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts -->
        <div class="row mb-4">
            <div class="col-lg-8 mb-4 mb-lg-0">
                <div class="card h-100">
                    <div class="card-header">
                        <h5 class="mb-0">6-Month Trend</h5>
                    </div>

                    <div class="card-body">
                        <div class="analytics-chart-container">
                            <canvas id="trendChart"
                                    role="img"
                                    aria-label="Income and expense trend over six months"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card h-100">
                    <div class="card-header">
                        <h5 class="mb-0">All-Time Category Breakdown</h5>
                    </div>

                    <div class="card-body">
                        <div class="analytics-pie-container">
                            <canvas id="categoryPieChart"
                                    role="img"
                                    aria-label="Expenses by category"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/analytics.js"></script>
</body>
</html>
```

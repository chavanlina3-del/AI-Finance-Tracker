<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget - AI Finance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>
    <div id="loading-overlay" style="display: none;">
        <div class="spinner"></div>
    </div>

    <!-- Sidebar -->
    <nav id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <i class="bi bi-robot"></i>
            <h4>AI Finance</h4>
        </div>
        <div class="sidebar-nav">
            <a href="dashboard.html" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="transactions.html" class="nav-link"><i class="bi bi-receipt"></i> Transactions</a>
            <a href="budget.html" class="nav-link active"><i class="bi bi-wallet2"></i> Budget</a>
            <a href="analytics.html" class="nav-link"><i class="bi bi-graph-up"></i> Analytics</a>
            <a href="goals.html" class="nav-link"><i class="bi bi-trophy"></i> Goals</a>
            <a href="assistant.html" class="nav-link"><i class="bi bi-robot"></i> AI Assistant</a>
        </div>
        <div class="sidebar-footer">
            <a href="#" class="nav-link" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
        </div>
    </nav>

    <main class="main-content">
        <header class="top-bar">
            <div class="d-flex align-items-center gap-3">
                <button id="mobileToggle" class="mobile-toggle"><i class="bi bi-list"></i></button>
                <h4 class="mb-0">Budget Planning</h4>
            </div>
            
            <div class="d-flex gap-2">
                <select id="monthSelect" class="form-select form-select-sm" style="width: 120px;">
                    <option value="1">January</option>
                    <option value="2">February</option>
                    <option value="3">March</option>
                    <option value="4">April</option>
                    <option value="5">May</option>
                    <option value="6">June</option>
                    <option value="7">July</option>
                    <option value="8">August</option>
                    <option value="9">September</option>
                    <option value="10">October</option>
                    <option value="11">November</option>
                    <option value="12">December</option>
                </select>
                <select id="yearSelect" class="form-select form-select-sm" style="width: 100px;">
                    <option value="2024">2024</option>
                    <option value="2025">2025</option>
                    <option value="2026">2026</option>
                </select>
            </div>
        </header>

        <div id="budgetContent">
            <!-- Dynamic Content -->
        </div>

    </main>

    <!-- Create/Edit Budget Modal -->
    <div class="modal fade" id="budgetModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Set Budget</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="budgetForm">
                        <input type="hidden" id="budgetId">
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="form-label text-muted">Total Monthly Budget</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control form-control-lg" id="totalBudget" required step="0.01">
                                </div>
                            </div>
                        </div>

                        <h6 class="mb-3">Category Limits</h6>
                        <div id="categoryInputs" class="row g-3">
                            <!-- Populated dynamically -->
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" form="budgetForm" class="btn btn-primary">Save Budget</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/budget.js"></script>
</body>
</html>

```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Finance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

    <div id="loading-overlay" style="display: none;">
        <div class="spinner"></div>
        <p class="mt-3">Logging in...</p>
    </div>

    <div class="auth-card text-center">
        <div class="mb-4">
            <i class="bi bi-robot text-primary" style="font-size: 3rem;"></i>
            <h3 class="mt-2">AI Finance Tracker</h3>
            <p class="text-muted">Welcome back! Please enter your details.</p>
        </div>

        <form id="loginForm" class="text-start">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email"
                       required autocomplete="email"
                       placeholder="Enter your email">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password"
                       required autocomplete="current-password"
                       placeholder="Enter your password">
            </div>

            <div class="d-flex justify-content-between mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label text-muted" for="rememberMe">
                        Remember for 30 days
                    </label>
                </div>
            </div>

            <button id="loginButton" type="submit"
                    class="btn btn-primary w-100 mb-3">
                Sign In
            </button>

            <p class="text-center text-muted">
                Don't have an account?
                <a href="register.html" class="text-primary text-decoration-none">Sign up</a>
            </p>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>

    <script>
        const API_BASE_URL = 'https://ai-finance-tracker-backend-s1g2.onrender.com';

        document.addEventListener('DOMContentLoaded', () => {
            redirectIfAuth();

            const form = document.getElementById('loginForm');
            const button = document.getElementById('loginButton');

            form.addEventListener('submit', async (event) => {
                event.preventDefault();

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const rememberMe = document.getElementById('rememberMe').checked;

                showLoading();
                button.disabled = true;

                try {
                    const response = await fetch(`${API_BASE_URL}/api/login`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await response.json().catch(() => ({}));

                    if (!response.ok || !data.success || !data.token) {
                        throw new Error(
                            data.error || data.message ||
                            'Login failed. Check your email and password.'
                        );
                    }

                    if (rememberMe) {
                        localStorage.setItem('token', data.token);
                        sessionStorage.removeItem('token');
                    } else {
                        sessionStorage.setItem('token', data.token);
                        localStorage.removeItem('token');
                    }

                    if (data.user) {
                        localStorage.setItem('user', JSON.stringify(data.user));
                    }

                    window.location.href = 'dashboard.html';

                } catch (error) {
                    console.error('Login failed:', error);

                    const message = error instanceof TypeError
                        ? 'Cannot connect to the online backend. Please try again shortly.'
                        : error.message;

                    showToast(message, 'danger');

                } finally {
                    hideLoading();
                    button.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
